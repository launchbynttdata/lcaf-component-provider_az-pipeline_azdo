parameters:
  - name: vmImageNameMSFTHosted
    type: string
  - name: serviceConnection
    type: string
  - name: targetEnvironment
    type: string

stages:
  - stage: Release_${{ parameters.targetEnvironment }}
    displayName: Release - ${{ parameters.targetEnvironment }}
    jobs:
      - template: ../jobs/deploy.yaml
        parameters:
          vmImageNameMSFTHosted: ${{ parameters.vmImageNameMSFTHosted }}
          serviceConnection: ${{ parameters.serviceConnection }}
          targetEnvironment: $(targetEnvironment)
      - template: ../../common/jobs/manual_approval.yaml
        parameters:
          vmImageNameMSFTHosted: ${{ parameters.vmImageNameMSFTHosted }}
          serviceConnection: ${{ parameters.serviceConnection }}
          targetEnvironment: ${{ parameters.targetEnvironment }}

          
