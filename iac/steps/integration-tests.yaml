parameters:
  - name: targetEnvironment
    type: string

steps:
  - task: AzureClI@2
    name: IntegrationTests_${{ parameters.targetEnvironment }}
    displayName: Integ tests - ${{ parameters.targetEnvironment }}
    inputs:
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(System.DefaultWorkingDirectory)
      inlineScript: |
        echo "dryrun: integration tests"
      addSpnToEnvironment: true
