parameters:
  - name: serviceConnection
    type: string
  - name: repositoryUrl
    type: string
    default: ''
  - name: gitToken
    type: string
    default: ''
  - name: commitSha
    type: string
    default: ''
  - name: targetEnvironment
    type: string

steps:
  - template: ../../common/steps/install_launch-cli.yaml
  - task: AzureClI@2
    displayName: Launch Terragrunt Plan
    inputs:
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(System.DefaultWorkingDirectory)
      inlineScript: |
        launch --version
        echo "dryrun: launch terragrunt --plan"
      addSpnToEnvironment: true
