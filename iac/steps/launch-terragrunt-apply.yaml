parameters:
  - name: serviceConnection
    type: string
  - name: targetEnvironment
    type: string

steps:
  - template: ../../common/steps/install_launch-cli.yaml
  - task: AzureClI@2
    displayName: Launch Terragrunt Apply
    inputs:
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(System.DefaultWorkingDirectory)
      # TODO: Remove asdf 
      inlineScript: |
        git clone https://github.com/asdf-vm/asdf.git ~/.asdf --branch v0.13.1
        echo '. "$HOME/.asdf/asdf.sh"' >> $BASH_ENV
        echo '. "$HOME/.asdf/completions/asdf.bash"' >> $BASH_ENV
        source "$HOME/.asdf/asdf.sh"
        export PATH="$PATH:$HOME/.asdf/bin"
        launch terragrunt \
          --target-environment ${{ parameters.targetEnvironment }} \
          --platform-resource service \
          --apply \
          --generation \
          --render-app-vars
      azureSubscription: ${{ parameters.serviceConnection }}
      addSpnToEnvironment: true
