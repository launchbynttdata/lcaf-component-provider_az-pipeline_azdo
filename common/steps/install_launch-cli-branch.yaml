steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.11'
    inputs:
      versionSpec: 3.11
  - script: |
      git clone -b patch/az-logic https://github.com/launchbynttdata/launch-cli.git $HOME/launch-cli
      pip install -e '.[dev]' -t $HOME/launch-cli
    displayName: 'Install Launch CLI'
