parameters:
  - name: vmImageNameMSFTHosted
    type: string
  - name: serviceConnection
    type: string

jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: ${{ parameters.vmImageNameMSFTHosted }}
    steps:
      - template: ../steps/launch-build-push.yaml
        parameters:
          serviceConnection: ${{ parameters.serviceConnection }}
